server.port=8080
spring.application.name=stayease-backend
spring.config.import=optional:file:../.env[.properties]

# Common application settings. Database and JWT secrets are supplied from environment variables.
# Example variables: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging
logging.level.com.stayease=INFO
logging.level.org.springframework.security=WARN
